name: Tests

# Runs on every push to any branch (a push to a pull request's branch also
# reports on the pull request) and on manual dispatch.
on:
  push:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  JENA_VERSION: 5.2.0
  # From https://archive.apache.org/dist/jena/binaries/apache-jena-5.2.0.tar.gz.sha512
  JENA_SHA512: 9a66044573ca269c0a9a1191fe7a8e1925f2d77e2e0bdadddd68616a1bafed1d9819c0b2988dd03614ec778a3882ccb091d825976fc0837406916f9f001b701c

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache Apache Jena
        id: cache-jena
        uses: actions/cache@v6
        with:
          path: ~/jena/apache-jena-${{ env.JENA_VERSION }}
          key: jena-${{ env.JENA_VERSION }}

      - name: Download Apache Jena
        if: steps.cache-jena.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/jena
          cd ~/jena
          curl -sSfL --retry 3 -o jena.tar.gz \
            "https://archive.apache.org/dist/jena/binaries/apache-jena-${JENA_VERSION}.tar.gz"
          echo "${JENA_SHA512}  jena.tar.gz" | sha512sum -c -
          tar xzf jena.tar.gz
          rm jena.tar.gz

      - name: Run tests
        env:
          # Fail instead of skipping if Jena can't be found.
          REQUIRE_JENA: "1"
        run: |
          export JENA_HOME="$HOME/jena/apache-jena-${JENA_VERSION}"
          "$JENA_HOME/bin/tdb2.tdbquery" --version
          python3 -m unittest discover -s tests -v
